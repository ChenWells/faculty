<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>房東管理系統需求文件</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#155263',
            secondary: '#ff6f3c',
            tertiary: '#ff9a3c',
            quaternary: '#ffc93c',
            primaryDark: '#0d3540',
            secondaryDark: '#e55a27',
            tertiaryDark: '#e58527',
            quaternaryDark: '#e5b427'
          }
        }
      }
    }
  </script>
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    html {
      scroll-behavior: smooth;
    }
    body {
      color: #333;
    }
    .markdown-body h1 {
      font-size: 2em;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      border-bottom: 1px solid #e5e7eb;
      padding-bottom: 0.3em;
      color: #155263;
    }
    .markdown-body h2 {
      font-size: 1.5em;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      padding-bottom: 0.3em;
      color: #155263;
    }
    .markdown-body h3 {
      font-size: 1.25em;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      color: #ff6f3c;
    }
    .markdown-body h4 {
      font-size: 1em;
      margin-top: 1.5em;
      margin-bottom: 0.5em;
      color: #ff9a3c;
    }
    .markdown-body ul, .markdown-body ol {
      padding-left: 2em;
      margin-bottom: 1em;
    }
    .markdown-body ul {
      list-style-type: disc;
    }
    .markdown-body ol {
      list-style-type: decimal;
    }
    .markdown-body li {
      margin-bottom: 0.5em;
    }
    .markdown-body p {
      margin-bottom: 1em;
      line-height: 1.6;
    }
    .markdown-body code {
      background-color: #f0f0f0;
      padding: 0.2em 0.4em;
      border-radius: 3px;
      font-family: monospace;
    }
    .markdown-body pre {
      background-color: #f0f0f0;
      padding: 1em;
      border-radius: 5px;
      overflow-x: auto;
      margin-bottom: 1em;
    }
    .markdown-body blockquote {
      border-left: 4px solid #ff9a3c;
      padding-left: 1em;
      color: #666;
      margin: 1em 0;
    }
    .markdown-body table {
      border-collapse: collapse;
      width: 100%;
      margin: 1em 0;
    }
    .markdown-body th, .markdown-body td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
    }
    .markdown-body th {
      background-color: #155263;
      color: white;
    }
    .markdown-body strong {
      color: #ff6f3c;
      font-weight: 600;
    }
    .dark {
      color-scheme: dark;
    }
    .dark .markdown-body h1,
    .dark .markdown-body h2 {
      color: #ffc93c;
    }
    .dark .markdown-body h3 {
      color: #ff9a3c; 
    }
    .dark .markdown-body h4 {
      color: #ff6f3c;
    }
    .dark .markdown-body strong {
      color: #ff9a3c;
    }
    .dark .markdown-body th {
      background-color: #0d3540;
    }
    .nav-item {
      border-left: 2px solid transparent;
      transition: all 0.2s;
    }
    .nav-item:hover {
      border-left-color: #ff9a3c;
      background-color: rgba(255, 154, 60, 0.1);
    }
    .nav-item.active {
      border-left-color: #ff6f3c;
      background-color: rgba(255, 111, 60, 0.1);
    }
    
    /* 在小屏幕上隱藏側邊欄 */
    @media (max-width: 768px) {
      .sidebar {
        transform: translateX(-100%);
        transition: transform 0.3s ease;
      }
      .sidebar.open {
        transform: translateX(0);
      }
    }
    
    /* 自定義滾動條 */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
    }
    ::-webkit-scrollbar-thumb {
      background: #ff9a3c;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ff6f3c;
    }
    .dark ::-webkit-scrollbar-track {
      background: #333;
    }
  </style>
</head>
<body class="bg-gray-50 text-gray-900">
  <div class="flex flex-col h-screen">
    <!-- 頂部導航 -->
    <header class="bg-primary text-white shadow-md">
      <div class="container mx-auto px-4 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold flex items-center">
          <i class="fas fa-home mr-2"></i>
          房東管理系統需求文件
        </h1>
        <div class="flex items-center space-x-4">
          <button id="printButton" class="p-2 rounded-md hover:bg-primaryDark transition" title="列印文件">
            <i class="fas fa-print"></i>
          </button>
          <button id="darkModeToggle" class="p-2 rounded-md hover:bg-primaryDark transition" title="切換深色模式">
            <i class="fas fa-moon"></i>
          </button>
          <button id="sidebarToggle" class="md:hidden p-2 rounded-md hover:bg-primaryDark transition" title="顯示/隱藏側邊欄">
            <i class="fas fa-bars"></i>
          </button>
        </div>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- 側邊導航 -->
      <aside id="sidebar" class="sidebar bg-white w-64 shadow-md overflow-y-auto flex-shrink-0 h-full md:block fixed md:static z-10 top-0 left-0 h-full pt-16 md:pt-0">
        <div class="px-4 py-6">
          <h2 class="text-lg font-semibold mb-4 text-primary flex items-center">
            <i class="fas fa-list-ul mr-2"></i>目錄
          </h2>
          <div class="mb-4">
            <div class="relative">
              <input type="text" id="searchInput" class="w-full py-2 px-3 border border-gray-300 rounded-md pl-10 focus:outline-none focus:ring-2 focus:ring-tertiary" placeholder="搜尋...">
              <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
            </div>
          </div>
          <div id="toc" class="space-y-1">
            <!-- 目錄將由 JavaScript 動態生成 -->
            <div class="animate-pulse">
              <div class="h-4 bg-gray-200 rounded w-3/4 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-1/2 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-2/3 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-3/5 mb-2"></div>
              <div class="h-4 bg-gray-200 rounded w-4/5 mb-2"></div>
            </div>
          </div>
        </div>
      </aside>

      <!-- 主要內容 -->
      <main class="flex-1 overflow-y-auto p-4 md:p-8">
        <div class="container mx-auto max-w-4xl markdown-body">
          <div id="content">
            <!-- 載入中指示器 -->
            <div class="flex justify-center items-center h-32">
              <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-secondary"></div>
            </div>
            <div class="space-y-4 animate-pulse">
              <div class="h-8 bg-gray-200 rounded w-3/4"></div>
              <div class="h-4 bg-gray-200 rounded w-full"></div>
              <div class="h-4 bg-gray-200 rounded w-5/6"></div>
              <div class="h-4 bg-gray-200 rounded w-4/6"></div>
              <div class="h-8 bg-gray-200 rounded w-2/4 mt-8"></div>
              <div class="h-4 bg-gray-200 rounded w-full"></div>
              <div class="h-4 bg-gray-200 rounded w-full"></div>
              <div class="h-4 bg-gray-200 rounded w-3/4"></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 獲取元素
      const darkModeToggle = document.getElementById('darkModeToggle');
      const sidebarToggle = document.getElementById('sidebarToggle');
      const sidebar = document.getElementById('sidebar');
      const toc = document.getElementById('toc');
      const content = document.getElementById('content');
      const searchInput = document.getElementById('searchInput');
      const printButton = document.getElementById('printButton');
      
      // 打印功能
      printButton.addEventListener('click', function() {
        window.print();
      });
      
      // 切換深色模式
      darkModeToggle.addEventListener('click', function() {
        document.documentElement.classList.toggle('dark');
        document.body.classList.toggle('bg-gray-900');
        document.body.classList.toggle('text-white');
        
        // 切換 icon
        const icon = darkModeToggle.querySelector('i');
        if (icon.classList.contains('fa-moon')) {
          icon.classList.remove('fa-moon');
          icon.classList.add('fa-sun');
        } else {
          icon.classList.remove('fa-sun');
          icon.classList.add('fa-moon');
        }
        
        // 深色模式下的元素調整
        const adjustElements = document.querySelectorAll('.bg-white, .text-primary, .text-gray-700, .text-gray-900');
        adjustElements.forEach(el => {
          if (document.documentElement.classList.contains('dark')) {
            el.classList.replace('bg-white', 'bg-gray-800');
            if (el.classList.contains('text-primary')) {
              el.classList.replace('text-primary', 'text-quaternary');
            }
            if (el.classList.contains('text-gray-700')) {
              el.classList.replace('text-gray-700', 'text-gray-100');
            }
            if (el.classList.contains('text-gray-900')) {
              el.classList.replace('text-gray-900', 'text-gray-100');
            }
          } else {
            el.classList.replace('bg-gray-800', 'bg-white');
            if (el.classList.contains('text-quaternary')) {
              el.classList.replace('text-quaternary', 'text-primary');
            }
            if (el.classList.contains('text-gray-100')) {
              el.classList.replace('text-gray-100', 'text-gray-700');
            }
          }
        });
      });
      
      // 切換側邊欄
      sidebarToggle.addEventListener('click', function() {
        sidebar.classList.toggle('open');
      });
      
      // 載入 Markdown 文件
      fetch('Landlord Management System Requirements with User, Property, Receivables, and Issue Management.markdown')
        .then(response => {
          if (!response.ok) {
            throw new Error('無法載入文件');
          }
          return response.text();
        })
        .then(markdown => {
          // 簡單的 Markdown 轉 HTML 處理
          // 注意：實際應用中應使用專業的 Markdown 解析器
          let html = markdown
            // 處理標題
            .replace(/^# (.*$)/gm, '<h1 id="$1">$1</h1>')
            .replace(/^## (.*$)/gm, '<h2 id="$1">$1</h2>')
            .replace(/^### (.*$)/gm, '<h3 id="$1">$1</h3>')
            .replace(/^#### (.*$)/gm, '<h4 id="$1">$1</h4>')
            // 處理列表
            .replace(/^\s*- (.*$)/gm, '<li>$1</li>')
            .replace(/<\/li>\n<li>/g, '</li><li>')
            .replace(/(<li>.*<\/li>)/g, '<ul>$1</ul>')
            .replace(/<\/ul>\n<ul>/g, '')
            // 處理粗體
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            // 處理斜體
            .replace(/\*(.*?)\*/g, '<em>$1</em>')
            // 處理段落
            .replace(/^(?!<[hl]|<ul|$)(.*$)/gm, '<p>$1</p>');
          
          // 設置內容
          content.innerHTML = html;
          
          // 生成目錄
          const headings = content.querySelectorAll('h1, h2, h3, h4');
          let tocHtml = '';
          
          headings.forEach(heading => {
            const id = heading.getAttribute('id') || heading.textContent.toLowerCase().replace(/[^\w\s-]/g, '').replace(/\s+/g, '-');
            if (!heading.getAttribute('id')) {
              heading.setAttribute('id', id);
            }
            
            const level = parseInt(heading.tagName.substring(1));
            const indentClass = level > 1 ? `ml-${(level-1)*4}` : '';
            
            tocHtml += `
              <div class="nav-item rounded py-1 px-2 ${indentClass}" data-heading="${heading.textContent.toLowerCase()}">
                <a href="#${id}" class="block text-sm hover:text-secondary transition">
                  ${heading.textContent}
                </a>
              </div>
            `;
          });
          
          toc.innerHTML = tocHtml;
          
          // 導航項點擊事件
          const navItems = document.querySelectorAll('.nav-item');
          navItems.forEach(item => {
            item.addEventListener('click', function() {
              navItems.forEach(i => i.classList.remove('active'));
              this.classList.add('active');
              
              if (window.innerWidth < 768) {
                sidebar.classList.remove('open');
              }
            });
          });
          
          // 搜尋功能
          searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase();
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
              const headingText = item.getAttribute('data-heading');
              if (headingText.includes(searchTerm)) {
                item.style.display = 'block';
              } else {
                item.style.display = 'none';
              }
            });
          });
          
          // 滾動監聽，高亮當前位置對應的導航項
          window.addEventListener('scroll', function() {
            const scrollPosition = window.scrollY;
            
            headings.forEach(heading => {
              const id = heading.getAttribute('id');
              const navItem = document.querySelector(`.nav-item a[href="#${id}"]`)?.parentElement;
              
              if (!navItem) return;
              
              const headingTop = heading.offsetTop;
              const headingHeight = heading.offsetHeight;
              
              if (scrollPosition >= headingTop - 100 && scrollPosition < headingTop + headingHeight - 100) {
                navItems.forEach(i => i.classList.remove('active'));
                navItem.classList.add('active');
              }
            });
          });
        })
        .catch(error => {
          content.innerHTML = `<div class="bg-red-100 border border-secondary text-secondary px-4 py-3 rounded">
            <strong>錯誤:</strong> ${error.message}
          </div>`;
        });
    });
  </script>
</body>
</html>
